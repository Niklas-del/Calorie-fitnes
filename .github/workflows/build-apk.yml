name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Android ABIs to build (comma-separated). arm64-v8a covers all modern phones."
        required: false
        default: "arm64-v8a"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `expo prebuild` regenerates android/gradle.properties on every run, which
      # defaults to building all four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64).
      # Each ABI compiles the React Native / Hermes / Reanimated native code from
      # scratch, so the default is ~4x more work than a phone build needs — every
      # 64-bit Android phone (essentially all of them since ~2015) runs arm64-v8a.
      # Overriding on the command line is the only way to change it, since the
      # generated android/ directory is not committed.
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=${{ inputs.architectures || 'arm64-v8a' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
