name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Android ABIs to build (comma-separated). arm64-v8a covers all modern phones."
        required: false
        default: "arm64-v8a"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # The first CI run deadlocked after a Gradle worker died: the failing task
    # was reported at 16:34:56 and then the build produced no further output at
    # all, sitting idle until it was cancelled 29 minutes later (the runner then
    # had to terminate three orphaned java processes). Fail fast instead of
    # burning a runner when that happens again.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The generated gradle.properties sets -Xmx2048m -XX:MaxMetaspaceSize=512m
      # with org.gradle.parallel=true. The first CI run logged "The Daemon will
      # expire after the build after running out of JVM Metaspace" and then died
      # in an aapt2-backed task, so those defaults are too small for a parallel
      # release build. Appended rather than committed because prebuild rewrites
      # this file every run; later keys win when Java loads a .properties file.
      - name: Raise Gradle memory limits
        run: echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      # `expo prebuild` regenerates android/gradle.properties on every run, which
      # defaults to building all four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64).
      # Each ABI compiles the React Native / Hermes / Reanimated native code from
      # scratch, so the default is ~4x more work than a phone build needs — every
      # 64-bit Android phone (essentially all of them since ~2015) runs arm64-v8a.
      # Overriding on the command line is the only way to change it, since the
      # generated android/ directory is not committed.
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=${{ inputs.architectures || 'arm64-v8a' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
